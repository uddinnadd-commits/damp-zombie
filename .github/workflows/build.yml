name: Build Forge Mod

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.8'

      - name: Build mod
        shell: bash
        run: |
          set -euo pipefail

          # Normal layout: the project (build.gradle) is at the repository root.
          project_dir="$GITHUB_WORKSPACE"

          # Fallback: the project was uploaded as a ZIP instead of as loose files.
          if [[ ! -f "$project_dir/build.gradle" && ! -f "$project_dir/build.gradle.kts" ]]; then
            mapfile -t zips < <(find . -maxdepth 1 -type f -iname '*.zip' | sort)
            if [[ ${#zips[@]} -eq 0 ]]; then
              echo "::error::No build.gradle at the repository root and no project ZIP found. Push the extracted project files (including src/, build.gradle, settings.gradle, gradle.properties)."
              exit 1
            fi
            if [[ ${#zips[@]} -gt 1 ]]; then
              echo "::error::Found ${#zips[@]} ZIP files at the repository root (${zips[*]}). Keep only one so the right project is built, or push the extracted files instead."
              exit 1
            fi
            archive="${zips[0]}"
            echo "Using project ZIP: $archive"
            project_dir="$RUNNER_TEMP/astral-echo-source"
            mkdir -p "$project_dir"
            unzip -q "$archive" -d "$project_dir"
            build_file="$(find "$project_dir" -type f \( -name build.gradle -o -name build.gradle.kts \) -print -quit)"
            if [[ -z "$build_file" ]]; then
              echo "::error::The ZIP does not contain build.gradle or build.gradle.kts."
              exit 1
            fi
            project_dir="$(dirname "$build_file")"
          fi

          echo "Building project from: $project_dir"
          gradle -p "$project_dir" build --no-daemon --stacktrace

          mkdir -p "$GITHUB_WORKSPACE/build-output"
          find "$project_dir/build/libs" -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -exec cp {} "$GITHUB_WORKSPACE/build-output/" \;
          if ! compgen -G "$GITHUB_WORKSPACE/build-output/*.jar" > /dev/null; then
            echo "::error::Gradle succeeded but no JAR was produced."
            exit 1
          fi

      - name: Upload mod jar
        uses: actions/upload-artifact@v7
        with:
          name: astral-echo-forge-1.20.1
          path: build-output/*.jar
          if-no-files-found: error
